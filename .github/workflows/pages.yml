name: Deploy resume to GitHub Pages

# Publishes the committed build/ artifacts at https://bronosky.com/resume/.
# Rebuild locally (see USAGE.md), commit build/, push. CI only copies.
#
# Branches named preview/<name> are also published, at /resume/preview/<name>/.
# Deleting such a branch removes its preview on the next run.
on:
  push:
    branches: [main, 'preview/**']
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # `delete` fires for every deleted ref; only care about preview branches.
    if: github.event_name != 'delete' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble site (see tools/assemble-site.sh)
        run: ./tools/assemble-site.sh dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
