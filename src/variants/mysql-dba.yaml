  - Terraform
  - Ansible
  - Chef
  - Packer
  - GitHub Actions / GitHub Enterprise
  - CloudFormation
  - CDK
  - Jenkins
  - ArgoCD
  - GitOps
- name: Bash/Shell Scripting
